{{- range $rolebinding := .Values.rolebindings }}
{{- range $namespace := $rolebinding.namespaces }}

{{- /*  Roles */ -}}
{{- range $index, $role := $rolebinding.roles }}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $namespace }}-{{ $role }}
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $role }}
subjects:
  {{- range $rolebinding.groups }}
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ . }}
  {{- end }}
  {{- range $rolebinding.users }}
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ . }}
  {{- end }}
{{- end }}

{{- /*  ClusterRoles */ -}}
{{- range $index, $role := $rolebinding.clusterroles }}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $namespace }}-{{ $role }}
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $role }}
subjects:
  {{- range $rolebinding.groups }}
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ . }}
  {{- end }}
  {{- range $rolebinding.users }}
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ . }}
  {{- end }}
{{- end }}

{{- end }}
{{- end }}